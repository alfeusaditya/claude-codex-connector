name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: bash -n install.sh shared/codex-ask.sh skills/codex-image/scripts/codex-image.sh tests/test.sh
      - name: Offline tests (fake codex)
        run: bash tests/test.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh shared/codex-ask.sh skills/codex-image/scripts/codex-image.sh tests/test.sh || true
